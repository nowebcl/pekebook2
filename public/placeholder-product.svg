<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff" />
      <stop offset="50%" stop-color="#f3e8ff" />
      <stop offset="100%" stop-color="#f5f3ff" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.08" flood-color="#581c87" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" />

  <!-- Subtle grid/dots -->
  <g opacity="0.25" fill="#a855f7">
    <circle cx="50" cy="50" r="1.5" />
    <circle cx="150" cy="50" r="1.5" />
    <circle cx="250" cy="50" r="1.5" />
    <circle cx="350" cy="50" r="1.5" />
    <circle cx="50" cy="150" r="1.5" />
    <circle cx="350" cy="150" r="1.5" />
    <circle cx="50" cy="250" r="1.5" />
    <circle cx="350" cy="250" r="1.5" />
    <circle cx="50" cy="350" r="1.5" />
    <circle cx="150" cy="350" r="1.5" />
    <circle cx="250" cy="350" r="1.5" />
    <circle cx="350" cy="350" r="1.5" />
  </g>

  <!-- Center Card -->
  <g filter="url(#cardShadow)">
    <rect x="50" y="55" width="300" height="290" rx="28" fill="#ffffff" stroke="#e9d5ff" stroke-width="2" />
  </g>

  <!-- Camera / Photo Icon in soft badge -->
  <g transform="translate(200, 145)">
    <circle cx="0" cy="0" r="46" fill="#f5f3ff" stroke="#d8b4fe" stroke-width="2" />
    <!-- Lucide Image icon -->
    <g transform="translate(-24, -24)" stroke="#9333ea" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="2" y="2" width="44" height="44" rx="10" fill="#ffffff" fill-opacity="0.7" />
      <circle cx="15" cy="15" r="4" fill="#9333ea" />
      <path d="m46 32-12-12-21 21" />
      <path d="m29 37 5-5 12 12" />
    </g>
  </g>

  <!-- Pill: Pronto imagen -->
  <g transform="translate(200, 245)">
    <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#18181b" />
    <text x="0" y="6" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="16" 
          font-weight="800" 
          letter-spacing="0.2" 
          fill="#ffffff">Pronto imagen</text>
  </g>

  <!-- Pekebook subtitle tag -->
  <text x="200" y="298" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="11" 
        font-weight="700" 
        letter-spacing="2" 
        fill="#9333ea" 
        text-transform="uppercase">PEKEBOOK</text>

  <text x="200" y="318" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="11" 
        font-weight="500" 
        fill="#71717a">Foto en preparación</text>
</svg>
